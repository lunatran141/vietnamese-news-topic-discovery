dataset:
  path: data/processed/p0_minimal.csv
  split_manifest_path: data/splits/split_manifest.csv
  split: train
  expected_articles: 6493
model_fit_split: train
artifact_splits:
- train
- val
- test
embedding:
  run_id: minilm_title_content
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  content_words: 60
  expected_dimensions: 384
  artifact_path: artifacts/embeddings/m10_v1_train_minilm.npz
  normalize_embeddings: true
umap:
  n_neighbors: 15
  n_components: 5
  min_dist: 0.0
  metric: cosine
  random_state: 42
hdbscan:
  metric: euclidean
  name: eom_15_5
  min_cluster_size: 15
  min_samples: 5
  cluster_selection_method: eom
keyword_extraction:
  method: TF-IDF trên văn bản gom theo cụm
  source_splits:
  - train
  - val
  - test
  text: processed_title + 60 từ đầu processed_content
  ngram_range:
  - 1
  - 2
  max_df: 0.9
  sublinear_tf: true
  max_features: 50000
  top_n_keywords: 10
  exclude_outlier_topic: true
representative_selection:
  source_splits:
  - train
  - val
  - test
  method: Top 5 topic_probability mỗi cụm, hòa điểm theo article_id
projection_2d:
  method: UMAP
  n_components: 2
  fit_split: train
  transform_split:
  - val
  - test
  purpose: visualization_only
