# Task M07 - Bag-of-Words + LDA Pipeline
# TV3 - LDA

dataset:
  path: "data/processed/p2_segmented.csv"
  split_manifest_path: "data/splits/split_manifest.csv"
  data_version: "v1.0"
  preprocessing_variant: "p2_segmented"
  text_variant: "text"
  train_split: "train"
  val_split: "val"
  test_split: "test"

vectorizer:
  max_features: 15000
  min_df: 3
  max_df: 0.85
  ngram_range: [1, 1]
  token_pattern: "(?u)\\b\\w\\w+\\b"

lda:
  n_components: 10
  learning_method: "batch"
  max_iter: 20
  random_state: 42
  evaluate_every: -1
  n_jobs: -1

artifacts:
  output_dir: "artifacts/lda"

results:
  output_dir: "results/lda"