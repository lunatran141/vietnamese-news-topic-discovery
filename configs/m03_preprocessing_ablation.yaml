# Cấu hình thực nghiệm bóc tách tiền xử lý (Task M03 - Preprocessing Ablation P0 đến P3).
# Đáp ứng Mục 10.3 và Phần B4/D3 của project_handbook.md.
# Nguyên tắc: Giữ nguyên split, seed, thuật toán và toàn bộ siêu tham số (Ceteris Paribus).
# Chỉ thay đổi duy nhất biến thể tiền xử lý đầu vào P0 -> P1 -> P2 -> P3.

dataset:
  split_manifest_path: "data/splits/split_manifest.csv"
  data_version: "v1.0"
  train_split: "train"
  val_split: "val"
  test_split: "test" # Khóa hoàn toàn, không dùng trong ablation

  variants:
    - id: "P0"
      name: "P0_minimal"
      path: "data/processed/p0_minimal.csv"
      description: "Làm sạch tối thiểu (Unicode NFC, gỡ HTML, giữ chữ hoa/thường, không tách từ, giữ từ dừng)"
    - id: "P1"
      name: "P1_normalized"
      path: "data/processed/p1_normalized.csv"
      description: "Chuẩn hóa có kiểm soát (chữ thường, token URL/EMAIL, gỡ lặp tiêu đề, không tách từ, giữ từ dừng)"
    - id: "P2"
      name: "P2_segmented"
      path: "data/processed/p2_segmented.csv"
      description: "Tách từ tiếng Việt bằng PyVi (nối từ ghép bằng gạch dưới, giữ từ dừng)"
    - id: "P3"
      name: "P3_no_stopwords"
      path: "data/processed/p3_no_stopwords.csv"
      description: "Lọc bỏ 388 từ dừng tiếng Việt (bảo vệ từ phủ định và từ khóa chủ đề)"

vectorizer:
  ngram_range: [1, 1]
  min_df: 2
  max_df: 0.85
  max_features: 20000
  sublinear_tf: true
  norm: "l2"
  token_pattern: "(?u)\\b\\w\\w+\\b"
  # Để cô lập triệt để giữa các biến thể, không để vectorizer tự động biến đổi thêm:
  lowercase: false # P0 giữ nguyên hoa/thường; P1-P3 đã được lowercase ở D03
  stopwords_file: null # Không lọc thêm từ dừng tại vectorizer (để P0, P1, P2 còn từ dừng, P3 đã lọc ở D03)

reference:
  stopwords_file: "configs/vietnamese_stopwords.txt" # Dùng làm từ điển quy chiếu tính tỷ lệ nhiễu từ dừng

clustering:
  algorithm: "kmeans"
  primary_k: 9 # Cấu hình tối ưu từ M02
  sensitivity_k_list: # Kiểm tra độ nhạy trên cả mốc chuẩn 7 chuyên mục và 9 cụm
    - 7
    - 9
  init: "k-means++"
  n_init: 10
  max_iter: 300
  random_state: 42
  stability_seeds:
    - 42
    - 43
    - 44
    - 45
    - 46

topics:
  top_n_keywords: 15
  representative_docs_per_cluster: 5

output:
  results_dir: "results/kmeans"
  figures_dir: "results/kmeans/figures"
