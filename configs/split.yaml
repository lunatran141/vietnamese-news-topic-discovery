# Cấu hình phân chia tập dữ liệu huấn luyện, kiểm định và kiểm thử (D05 Dataset Splits Config)
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  stratify_column: "category_gold"
  id_column: "article_id"
  output_dir: "data/splits"
  manifest_filename: "split_manifest.csv"

