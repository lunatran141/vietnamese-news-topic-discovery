# Cấu hình TF-IDF feature extraction pipeline cho Task M01.
# Chỉ fit trên train_split; validation_split dùng để tuning; test_split khóa hoàn toàn đến M05.

dataset:
  path: "data/processed/p2_segmented.csv"
  split_manifest_path: "data/splits/split_manifest.csv"
  data_version: "v1.0"
  preprocessing_variant: "p2_segmented"
  text_variant: "text"
  train_split: "train"
  val_split: "val"
  test_split: "test"

vectorizer:
  stopwords_file: "configs/vietnamese_stopwords.txt"
  ngram_range: [1, 2]
  min_df: 3
  max_df: 0.85
  max_features: 15000
  sublinear_tf: true
  norm: "l2"
  token_pattern: "(?u)\\b\\w\\w+\\b"

artifacts:
  output_dir: "artifacts/tfidf"

tuning_grid:
  ngram_range:
    - [1, 1]
    - [1, 2]
  min_df:
    - 2
    - 3
    - 5
  max_df:
    - 0.80
    - 0.85
    - 0.90
  max_features:
    - 10000
    - 15000
    - 20000
  sublinear_tf:
    - true

