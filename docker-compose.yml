services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
      - ./results:/app/results
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
      - ./results:/app/results
    depends_on:
      api:
        condition: service_healthy
